<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-list Diário com Revisão da Gestora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#09090b',
                        darkcard: '#18181b',
                        darkborder: '#27272a',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body class="text-zinc-100 min-h-screen antialiased pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const checklistData = [
            {
                id: "sec_1",
                title: "1 - RECEPÇÃO",
                items: [
                    { id: "1_1", text: "Foco em estar com ambiente pronto ao cliente" },
                    { id: "1_2", text: "Mis en place de café" },
                    { id: "1_3", text: "Mis en place de escritório" }
                ]
            },
            {
                id: "sec_2",
                title: "2 - PÁTIO",
                items: [
                    { id: "2_1", text: "Repor água das máquinas e da garrafa" },
                    { id: "2_2", text: "Repõe as cápsulas, sachês, e mexedor de café" },
                    { id: "2_3", text: "Repõe as xícaras e copos" },
                    { id: "2_4", text: "Higienização geral das superfícies" },
                    { id: "2_5", text: "Troca o lixo" },
                    { id: "2_6", text: "Regar as plantas" },
                    { id: "2_7", text: "Passar pano chão" }
                ]
            },
            {
                id: "sec_3",
                title: "3 - ÁREA DE CONVIVÊNCIA",
                items: [
                    { id: "3_1", text: "Varrer a sala" },
                    { id: "3_2", text: "Repor água das máquinas" },
                    { id: "3_3", text: "Repõe as cápsulas, sachês, e mexedor de café" },
                    { id: "3_4", text: "Repõe as xícaras e copos" },
                    { id: "3_5", text: "Higienização geral das superfícies" },
                    { id: "3_6", text: "Troca o lixo" },
                    { id: "3_7", text: "Regar as plantas" },
                    { id: "3_8", text: "Passar pano no chão" }
                ]
            },
            {
                id: "sec_4",
                title: "4 - SALA DE REUNIÃO",
                items: [
                    { id: "4_1", text: "Limpeza das superfícies" },
                    { id: "4_2", text: "Varre" },
                    { id: "4_3", text: "Passar pano no chão" }
                ]
            },
            {
                id: "sec_5",
                title: "5 - SALA DO LINCOILN",
                items: [
                    { id: "5_1", text: "Repor água da geladeira" },
                    { id: "5_2", text: "Limpa as superfícies" },
                    { id: "5_3", text: "Varrer" },
                    { id: "5_4", text: "Passar pano chão" },
                    { id: "5_5", text: "Tira o lixo" }
                ]
            },
            {
                id: "sec_6",
                title: "6 - COPINHA",
                items: [
                    { id: "6_1", text: "Lavar louça" },
                    { id: "6_2", text: "Limpa as superfícies" },
                    { id: "6_3", text: "Tira o lixo" },
                    { id: "6_4", text: "Repõe papel toalha" },
                    { id: "6_5", text: "Descer panos de prato para lavar" }
                ]
            },
            {
                id: "sec_7",
                title: "7 - SALA ADMINISTRATIVO",
                items: [
                    { id: "7_1", text: "Limpa as superfícies" },
                    { id: "7_2", text: "Varre" },
                    { id: "7_3", text: "Passar pano chão" },
                    { id: "7_4", text: "Tira o lixo" }
                ]
            },
            {
                id: "sec_8",
                title: "8 - BANHEIRO",
                items: [
                    { id: "8_1", text: "Limpa as superfícies" },
                    { id: "8_2", text: "Repor papéis" },
                    { id: "8_3", text: "Lavar vaso" },
                    { id: "8_4", text: "Manutenção do lixo" },
                    { id: "8_5", text: "1x por semana lavar o banheiro todo" }
                ]
            },
            {
                id: "sec_9",
                title: "9 - LIMPEZA DE VIDROS BOXES E PORTAS",
                items: [
                    { id: "9_1", text: "Passar pano com vinagre" },
                    { id: "9_2", text: "Passar pano seco" }
                ]
            },
            {
                id: "sec_10",
                title: "10 - BANHEIROS DE FUNCIONÁRIOS",
                items: [
                    { id: "10_1", text: "1x por semana lavar o banheiro todo" },
                    { id: "10_2", text: "Limpa as superfícies" },
                    { id: "10_3", text: "Repor papéis" },
                    { id: "10_4", text: "Lavar vaso" },
                    { id: "10_5", text: "Manutenção do lixo" }
                ]
            },
            {
                id: "sec_11",
                title: "11 - COPA - café da manhã",
                items: [
                    { id: "11_1", text: "Limpa as superfícies" },
                    { id: "11_2", text: "Varrer" },
                    { id: "11_3", text: "Passar pano" },
                    { id: "11_4", text: "Lavar a louça" }
                ]
            },
            {
                id: "sec_12",
                title: "12 - LIMPEZA DOS PANOS",
                items: [
                    { id: "12_1", text: "Separar por uso" },
                    { id: "12_2", text: "Colocar de molho os mais limpos" },
                    { id: "12_3", text: "Esfregar os encardidos" }
                ]
            },
            {
                id: "sec_13",
                title: "13 - CAFÉ DA TARDE / COPA - Almoço",
                items: [
                    { id: "13_1", text: "Limpa as superfícies" },
                    { id: "13_2", text: "Varrer" },
                    { id: "13_3", text: "Passar pano" }
                ]
            },
            {
                id: "sec_15",
                title: "15 - REVISÃO PARA FECHAMENTO",
                items: [
                    { id: "15_1", text: "Revisão geral para fechamento (áreas cliente)" }
                ]
            }
        ];

        function App() {
            const [selectedDate, setSelectedDate] = useState("");
            const [itemStatuses, setItemStatuses] = useState({});
            const [isDaySaved, setIsDaySaved] = useState(false);
            const [displayDateText, setDisplayDateText] = useState("");
            const [currentRole, setCurrentRole] = useState("funcionario");
            const [showSaveNotification, setShowSaveNotification] = useState(false);

            const totalTasks = checklistData.reduce((acc, sec) => acc + sec.items.length, 0);
            const completedCount = Object.values(itemStatuses).filter(status => status === 'feito' || status === 'revisado').length;
            const reviewedCount = Object.values(itemStatuses).filter(status => status === 'revisado').length;
            
            const progressPercentage = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;
            const reviewPercentage = totalTasks > 0 ? Math.round((reviewedCount / totalTasks) * 100) : 0;

            useEffect(() => {
                const today = new Date();
                setSelectedDate(today.toLocaleDateString('sv-SE'));
            }, []);

            useEffect(() => {
                if (!selectedDate) return;

                const [year, month, day] = selectedDate.split("-");
                const dateObj = new Date(year, month - 1, day);
                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                const formatted = dateObj.toLocaleDateString('pt-BR', options);
                setDisplayDateText(formatted.charAt(0).toUpperCase() + formatted.slice(1));

                const globalHistory = JSON.parse(localStorage.getItem('checklist_v2_history') || '{}');
                const dayData = globalHistory[selectedDate] || { statuses: {}, saved: false };
                
                setItemStatuses(dayData.statuses || {});
                setIsDaySaved(dayData.saved || false);
            }, [selectedDate]);

            const handleItemClick = (itemId) => {
                setItemStatuses(prev => {
                    const currentStatus = prev[itemId];
                    let newStatus = null;

                    if (currentRole === 'funcionario') {
                        if (currentStatus === 'revisado') return prev;
                        newStatus = currentStatus === 'feito' ? null : 'feito';
                    } else if (currentRole === 'gestora') {
                        newStatus = currentStatus === 'revisado' ? 'feito' : 'revisado';
                    }

                    const updatedStatuses = { ...prev, [itemId]: newStatus };
                    saveToGlobalStorage(updatedStatuses, isDaySaved);
                    return updatedStatuses;
                });
            };

            const saveToGlobalStorage = (statuses, savedFlag) => {
                const globalHistory = JSON.parse(localStorage.getItem('checklist_v2_history') || '{}');
                globalHistory[selectedDate] = { statuses, saved: savedFlag };
                localStorage.setItem('checklist_v2_history', JSON.stringify(globalHistory));
            };

            const handleEmployeeSave = () => {
                setIsDaySaved(true);
                saveToGlobalStorage(itemStatuses, true);
                setShowSaveNotification(true);
                setTimeout(() => setShowSaveNotification(false), 4000);
            };

            const resetDay = () => {
                if (window.confirm("Tem certeza que deseja zerar todas as marcações deste dia?")) {
                    setItemStatuses({});
                    setIsDaySaved(false);
                    saveToGlobalStorage({}, false);
                }
            };

            return (
                <div class="max-w-6xl mx-auto px-4 pt-6">
                    {showSaveNotification && (
                        <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-black px-6 py-3 rounded-xl font-bold shadow-2xl flex items-center gap-2 animate-bounce">
                            <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                            Check-list salvo com sucesso! Pronto para a gestora revisar.
                        </div>
                    )}

                    <header class="bg-darkcard border border-darkborder rounded-2xl p-6 mb-6 shadow-xl sticky top-2 z-40 backdrop-blur-md bg-opacity-90">
                        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6">
                            <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                                <div>
                                    <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
                                        <svg class="w-6 h-6 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                        </svg>
                                        SISTEMA DE CHECK-LIST
                                    </h1>
                                    <div class="text-[11px] text-zinc-400 mt-0.5 font-medium flex items-center gap-2">
                                        <span>{displayDateText}</span>
                                        {isDaySaved && (
                                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded text-[10px] uppercase font-bold">
                                                💾 Salvo p/ Funcionário
                                            </span>
                                        )}
                                    </div>
                                </div>
                                <input 
                                    type="date" 
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    class="bg-zinc-900 border border-darkborder rounded-xl px-3 py-2 text-sm text-white font-medium focus:outline-none focus:border-zinc-500"
                                />
                            </div>

                            <div class="bg-zinc-900 p-1 rounded-xl border border-darkborder flex self-start lg:self-center">
                                <button onClick={() => setCurrentRole('funcionario')} class={`px-4 py-2 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-all duration-150 ${currentRole === 'funcionario' ? 'bg-emerald-600 text-white shadow' : 'text-zinc-400 hover:text-zinc-200'}`}>
                                    🧑‍🔧 Funcionário
                                </button>
                                <button onClick={() => setCurrentRole('gestora')} class={`px-4 py-2 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-all duration-150 ${currentRole === 'gestora' ? 'bg-blue-600 text-white shadow' : 'text-zinc-400 hover:text-zinc-200'}`}>
                                    👩‍💼 Gestora
                                </button>
                            </div>
                            
                            <div class="flex items-center gap-4 min-w-[260px] lg:justify-end">
                                <div class="flex-1 lg:flex-none">
                                    <div class="flex justify-between text-[11px] font-semibold text-zinc-400 mb-1 gap-4">
                                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span>Feito: {progressPercentage}%</span>
                                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-blue-500 rounded-full"></span>Revisado: {reviewPercentage}%</span>
                                    </div>
                                    <div class="w-full lg:w-44 bg-zinc-800 rounded-full h-2 relative overflow-hidden">
                                        <div class="bg-emerald-500 h-full absolute left-0 top-0 transition-all duration-300" style={{ width: `${progressPercentage}%`, zIndex: 1 }}></div>
                                        <div class="bg-blue-500 h-full absolute left-0 top-0 transition-all duration-300" style={{ width: `${reviewPercentage}%`, zIndex: 2 }}></div>
                                    </div>
                                </div>

                                {currentRole === 'funcionario' && (
                                    <button onClick={handleEmployeeSave} class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs rounded-xl shadow transition-all duration-200 flex items-center gap-1">
                                        💾 Salvar
                                    </button>
                                )}

                                <button onClick={resetDay} class="p-2.5 bg-zinc-800 hover:bg-red-950/40 border border-zinc-700 hover:border-red-800/60 rounded-xl text-zinc-400 hover:text-red-400 transition-all duration-200" title="Zerar este dia">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {checklistData.map((section) => (
                            <section key={section.id} class="bg-darkcard border border-darkborder rounded-2xl overflow-hidden shadow-md flex flex-col">
                                <div class="bg-zinc-900 border-b border-darkborder px-4 py-3">
                                    <h2 class="text-xs font-bold text-zinc-400 tracking-wide uppercase">{section.title}</h2>
                                </div>

                                <div class="p-3 flex-1 flex flex-col gap-2">
                                    {section.items.map((item) => {
                                        const status = itemStatuses[item.id];
                                        let buttonStyles = "bg-zinc-900/40 border-zinc-800 text-zinc-300 hover:bg-zinc-800/50";
                                        let checkboxStyles = "border-zinc-600 bg-zinc-950";
                                        let textStyles = "";
                                        let checkIcon = null;

                                        if (status === 'feito') {
                                            buttonStyles = "bg-emerald-950/20 border-emerald-500/40 text-emerald-300";
                                            checkboxStyles = "bg-emerald-500 border-emerald-400 text-black";
                                            textStyles = "line-through text-emerald-400/60";
                                            checkIcon = <svg class="w-3 h-3 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>;
                                        } else if (status === 'revisado') {
                                            buttonStyles = "bg-blue-950/20 border-blue-500/40 text-blue-300";
                                            checkboxStyles = "bg-blue-500 border-blue-400 text-white";
                                            textStyles = "line-through text-blue-400/60 font-semibold";
                                            checkIcon = <svg class="w-3 h-3 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>;
                                        }

                                        return (
                                            <button 
                                                key={item.id} 
                                                onClick={() => handleItemClick(item.id)} 
                                                disabled={currentRole === 'funcionario' && status === 'revisado'}
                                                class={`w-full text-left p-3 rounded-xl border flex items-start gap-3 transition-all duration-150 select-none ${buttonStyles} ${currentRole === 'funcionario' && status === 'revisado' ? 'cursor-not-allowed opacity-80' : 'cursor-pointer'}`}
                                            >
                                                <div class={`mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition-all duration-150 ${checkboxStyles}`}>
                                                    {checkIcon}
                                                </div>
                                                <div class="flex flex-col flex-1">
                                                    <span class={`text-sm font-medium leading-tight ${textStyles}`}>{item.text}</span>
                                                    {status === 'revisado' && (
                                                        <span class="text-[9px] text-blue-400/80 mt-0.5 uppercase tracking-wider font-bold">✓ Revisado por Gestora</span>
                                                    )}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>
                        ))}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
