<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-list Diário com Histórico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#09090b',
                        darkcard: '#18181b',
                        darkborder: '#27272a',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            -webkit-tap-highlight-color: transparent;
        }
        /* Customizar o input de data no dark mode */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body class="text-zinc-100 min-h-screen antialiased pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const checklistData = [
            {
                id: "sec_1",
                title: "1 - RECEPÇÃO",
                items: [
                    { id: "1_1", text: "Foco em estar com ambiente pronto ao cliente" },
                    { id: "1_2", text: "Mis en place de café" },
                    { id: "1_3", text: "Mis en place de escritório" }
                ]
            },
            {
                id: "sec_2",
                title: "2 - PÁTIO",
                items: [
                    { id: "2_1", text: "Repor água das máquinas e da garrafa" },
                    { id: "2_2", text: "Repõe as cápsulas, sachês, e mexedor de café" },
                    { id: "2_3", text: "Repõe as xícaras e copos" },
                    { id: "2_4", text: "Higienização geral das superfícies" },
                    { id: "2_5", text: "Troca o lixo" },
                    { id: "2_6", text: "Regar as plantas" },
                    { id: "2_7", text: "Passar pano chão" }
                ]
            },
            {
                id: "sec_3",
                title: "3 - ÁREA DE CONVIVÊNCIA",
                items: [
                    { id: "3_1", text: "Varrer a sala" },
                    { id: "3_2", text: "Repor água das máquinas" },
                    { id: "3_3", text: "Repõe as cápsulas, sachês, e mexedor de café" },
                    { id: "3_4", text: "Repõe as xícaras e copos" },
                    { id: "3_5", text: "Higienização geral das superfícies" },
                    { id: "3_6", text: "Troca o lixo" },
                    { id: "3_7", text: "Regar as plantas" },
                    { id: "3_8", text: "Passar pano no chão" }
                ]
            },
            {
                id: "sec_4",
                title: "4 - SALA DE REUNIÃO",
                items: [
                    { id: "4_1", text: "Limpeza das superfícies" },
                    { id: "4_2", text: "Varre" },
                    { id: "4_3", text: "Passar pano no chão" }
                ]
            },
            {
                id: "sec_5",
                title: "5 - SALA DO LINCOILN",
                items: [
                    { id: "5_1", text: "Repor água da geladeira" },
                    { id: "5_2", text: "Limpa as superfícies" },
                    { id: "5_3", text: "Varrer" },
                    { id: "5_4", text: "Passar pano chão" },
                    { id: "5_5", text: "Tira o lixo" }
                ]
            },
            {
                id: "sec_6",
                title: "6 - COPINHA",
                items: [
                    { id: "6_1", text: "Lavar louça" },
                    { id: "6_2", text: "Limpa as superfícies" },
                    { id: "6_3", text: "Tira o lixo" },
                    { id: "6_4", text: "Repõe papel toalha" },
                    { id: "6_5", text: "Descer panos de prato para lavar" }
                ]
            },
            {
                id: "sec_7",
                title: "7 - SALA ADMINISTRATIVO",
                items: [
                    { id: "7_1", text: "Limpa as superfícies" },
                    { id: "7_2", text: "Varre" },
                    { id: "7_3", text: "Passar pano chão" },
                    { id: "7_4", text: "Tira o lixo" }
                ]
            },
            {
                id: "sec_8",
                title: "8 - BANHEIRO",
                items: [
                    { id: "8_1", text: "Limpa as superfícies" },
                    { id: "8_2", text: "Repor papéis" },
                    { id: "8_3", text: "Lavar vaso" },
                    { id: "8_4", text: "Manutenção do lixo" },
                    { id: "8_5", text: "1x por semana lavar o banheiro todo" }
                ]
            },
            {
                id: "sec_9",
                title: "9 - LIMPEZA DE VIDROS BOXES E PORTAS",
                items: [
                    { id: "9_1", text: "Passar pano com vinagre" },
                    { id: "9_2", text: "Passar pano seco" }
                ]
            },
            {
                id: "sec_10",
                title: "10 - BANHEIROS DE FUNCIONÁRIOS",
                items: [
                    { id: "10_1", text: "1x por semana lavar o banheiro todo" },
                    { id: "10_2", text: "Limpa as superfícies" },
                    { id: "10_3", text: "Repor papéis" },
                    { id: "10_4", text: "Lavar vaso" },
                    { id: "10_5", text: "Manutenção do lixo" }
                ]
            },
            {
                id: "sec_11",
                title: "11 - COPA - café da manhã",
                items: [
                    { id: "11_1", text: "Limpa as superfícies" },
                    { id: "11_2", text: "Varrer" },
                    { id: "11_3", text: "Passar pano" },
                    { id: "11_4", text: "Lavar a louça" }
                ]
            },
            {
                id: "sec_12",
                title: "12 - LIMPEZA DOS PANOS",
                items: [
                    { id: "12_1", text: "Separar por uso" },
                    { id: "12_2", text: "Colocar de molho os mais limpos" },
                    { id: "12_3", text: "Esfregar os encardidos" }
                ]
            },
            {
                id: "sec_13",
                title: "13 - CAFÉ DA TARDE / COPA - Almoço",
                items: [
                    { id: "13_1", text: "Limpa as superfícies" },
                    { id: "13_2", text: "Varrer" },
                    { id: "13_3", text: "Passar pano" }
                ]
            },
            {
                id: "sec_15",
                title: "15 - REVISÃO PARA FECHAMENTO",
                items: [
                    { id: "15_1", text: "Revisão geral para fechamento (áreas cliente)" }
                ]
            }
        ];

        function App() {
            const [selectedDate, setSelectedDate] = useState("");
            const [completedItems, setCompletedItems] = useState({});
            const [displayDateText, setDisplayDateText] = useState("");

            const totalTasks = checklistData.reduce((acc, sec) => acc + sec.items.length, 0);
            const completedCount = Object.values(completedItems).filter(Boolean).length;
            const progressPercentage = totalTasks > 0 ? Math.round((completedCount / totalTasks) * 100) : 0;

            // Inicializa com a data de hoje
            useEffect(() => {
                const today = new Date();
                const localDateStr = today.toLocaleDateString('sv-SE'); // Formato YYYY-MM-DD estável
                setSelectedDate(localDateStr);
            }, []);

            // Disparado sempre que o usuário muda a data no calendário
            useEffect(() => {
                if (!selectedDate) return;

                // 1. Atualizar o texto da data por extenso
                const [year, month, day] = selectedDate.split("-");
                const dateObj = new Date(year, month - 1, day);
                const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
                const formatted = dateObj.toLocaleDateString('pt-BR', options);
                setDisplayDateText(formatted.charAt(0).toUpperCase() + formatted.slice(1));

                // 2. Carregar os itens salvos especificamente desta data
                const globalHistory = JSON.parse(localStorage.getItem('checklist_global_history') || '{}');
                setCompletedItems(globalHistory[selectedDate] || {});
            }, [selectedDate]);

            const toggleItem = (itemId) => {
                setCompletedItems(prev => {
                    const updatedItems = { ...prev, [itemId]: !prev[itemId] };
                    
                    // Salva no histórico global associado àquela data específica
                    const globalHistory = JSON.parse(localStorage.getItem('checklist_global_history') || '{}');
                    globalHistory[selectedDate] = updatedItems;
                    localStorage.setItem('checklist_global_history', JSON.stringify(globalHistory));
                    
                    return updatedItems;
                });
            };

            const resetDay = () => {
                if (window.confirm(`Tem certeza que deseja limpar as marcações do dia selecionado?`)) {
                    const emptyState = {};
                    setCompletedItems(emptyState);
                    
                    const globalHistory = JSON.parse(localStorage.getItem('checklist_global_history') || '{}');
                    globalHistory[selectedDate] = emptyState;
                    localStorage.setItem('checklist_global_history', JSON.stringify(globalHistory));
                }
            };

            const setToday = () => {
                const today = new Date().toLocaleDateString('sv-SE');
                setSelectedDate(today);
            };

            const isTodaySelected = selectedDate === new Date().toLocaleDateString('sv-SE');

            return (
                <div class="max-w-6xl mx-auto px-4 pt-6">
                    {/* Header */}
                    <header class="bg-darkcard border border-darkborder rounded-2xl p-6 mb-8 shadow-xl sticky top-2 z-50 backdrop-blur-md bg-opacity-90">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                            
                            {/* Bloco da Esquerda: Título e Seleção de Data */}
                            <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                                <div>
                                    <h1 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
                                        <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                                        </svg>
                                        CHECK-LIST DE SERVIÇOS
                                    </h1>
                                    <p class="text-xs text-emerald-400 font-medium mt-1">
                                        {isTodaySelected ? "Visualizando: HOJE" : "Visualizando dia do HISTÓRICO"}
                                    </p>
                                </div>

                                {/* Seletor de Data (Calendário) */}
                                <div class="flex items-center gap-2">
                                    <input 
                                        type="date" 
                                        value={selectedDate}
                                        onChange={(e) => setSelectedDate(e.target.value)}
                                        class="bg-zinc-900 border border-darkborder rounded-xl px-3 py-2 text-sm text-white font-medium focus:outline-none focus:border-emerald-500 transition-all duration-200"
                                    />
                                    {!isTodaySelected && (
                                        <button 
                                            onClick={setToday}
                                            class="px-2.5 py-2 bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/30 text-emerald-400 hover:text-white text-xs font-bold rounded-xl transition-all duration-200"
                                        >
                                            Voltar para Hoje
                                        </button>
                                    )}
                                </div>
                            </div>
                            
                            {/* Bloco da Direita: Progresso e Ações */}
                            <div class="flex items-center gap-4 min-w-[240px] md:justify-end">
                                <div class="flex-1 md:flex-none">
                                    <div class="flex justify-between text-xs font-semibold text-zinc-400 mb-1">
                                        <span>Progresso do dia</span>
                                        <span class="text-emerald-400 font-bold">{progressPercentage}% ({completedCount}/{totalTasks})</span>
                                    </div>
                                    <div class="w-full md:w-48 bg-zinc-800 rounded-full h-2.5 overflow-hidden">
                                        <div 
                                            class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" 
                                            style={{ width: `${progressPercentage}%` }}
                                        ></div>
                                    </div>
                                    <div class="text-[10px] text-zinc-500 mt-0.5 text-right">
                                        {displayDateText}
                                    </div>
                                </div>
                                <button 
                                    onClick={resetDay} 
                                    class="p-2.5 bg-zinc-800 hover:bg-red-950/40 border border-zinc-700 hover:border-red-800/60 rounded-xl text-zinc-400 hover:text-red-400 transition-all duration-200"
                                    title="Limpar este dia"
                                >
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>

                        </div>
                    </header>

                    {/* Grid de Seções */}
                    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {checklistData.map((section) => (
                            <section key={section.id} class="bg-darkcard border border-darkborder rounded-2xl overflow-hidden shadow-md flex flex-col">
                                <div class="bg-zinc-900 border-b border-darkborder px-4 py-3.5">
                                    <h2 class="text-sm font-bold text-zinc-300 tracking-wide uppercase">{section.title}</h2>
                                </div>

                                <div class="p-3 flex-1 flex flex-col gap-2">
                                    {section.items.map((item) => {
                                        const isDone = !!completedItems[item.id];
                                        return (
                                            <button 
                                                key={item.id} 
                                                onClick={() => toggleItem(item.id)} 
                                                class={`w-full text-left p-3 rounded-xl border flex items-start gap-3 transition-all duration-200 cursor-pointer select-none ${isDone ? 'bg-emerald-950/20 border-emerald-500/40 text-emerald-300 shadow-inner' : 'bg-zinc-900/40 border-zinc-800 text-zinc-300 hover:bg-zinc-800/50'}`}
                                            >
                                                <div class={`mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition-all duration-200 ${isDone ? 'bg-emerald-500 border-emerald-400 text-black' : 'border-zinc-600 bg-zinc-950'}`}>
                                                    {isDone && (
                                                        <svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                                        </svg>
                                                    )}
                                                </div>
                                                <span class={`text-sm font-medium leading-tight ${isDone ? 'line-through text-emerald-400/70' : ''}`}>{item.text}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>
                        ))}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
